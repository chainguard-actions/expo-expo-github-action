name: Test deprecated inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          expo-version: latest
          eas-version: latest
          packager: npm
          patch-watchers: false
          # Deprecated inputs — included for coverage; the action should accept
          # them without crashing (they are no-ops or emit deprecation warnings)
          username: fake-expo-user
          password: fake-expo-password
          expo-cache-key: custom-expo-cache-key
          eas-cache-key: custom-eas-cache-key
        continue-on-error: true
      - name: Assert action ran with deprecated inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Deprecated inputs are accepted but may cause auth failure with fake creds.
          # We verify the action ran (not skipped or errored at input parsing level).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with deprecated inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
