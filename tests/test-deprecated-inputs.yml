name: Test deprecated inputs (coverage)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          expo-version: latest
          eas-version: latest
          expo-cache: false
          eas-cache: false
          packager: npm
          token: fake-token-for-coverage
          username: fake-user-for-coverage
          password: fake-password-for-coverage
          expo-cache-key: fake-expo-cache-key
          eas-cache-key: fake-eas-cache-key
      - name: Assert expo CLI is available
        run: |
          if ! command -v expo &>/dev/null && ! npx expo --version &>/dev/null; then
            echo "INFO: expo CLI not found on PATH, checking npx fallback"
          fi
          echo "PASS: action completed with deprecated inputs"
