name: Test deprecated and auth inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          eas-version: latest
          eas-cache: false
          eas-cache-key: custom-eas-cache-key
          expo-version: latest
          expo-cache: false
          expo-cache-key: custom-expo-cache-key
          packager: npm
          patch-watchers: false
          token: fake-expo-token
          username: fake-expo-user
          password: fake-expo-password
        continue-on-error: true
      - name: Assert action ran (CLIs installed or failed gracefully with deprecated/fake auth)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
