name: Test deprecated and auth inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          eas-version: latest
          eas-cache: false
          expo-version: latest
          expo-cache: false
          packager: npm
          patch-watchers: false
          token: fake-token-for-coverage
          username: fake-user-for-coverage
          password: fake-password-for-coverage
          eas-cache-key: custom-eas-cache-key
          expo-cache-key: custom-expo-cache-key
      - name: Assert action ran (may fail due to fake token but inputs were accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with deprecated and auth inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
