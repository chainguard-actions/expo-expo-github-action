name: Test Expo CLI installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          expo-version: latest
          expo-cache: false
          packager: npm
          patch-watchers: false
      - name: Assert Expo CLI is installed
        run: |
          echo "Checking Expo CLI installation..."
          if ! command -v expo &> /dev/null; then
            echo "FAIL: expo command not found in PATH"
            exit 1
          fi
          EXPO_VERSION=$(expo --version 2>&1 || true)
          echo "Expo version: $EXPO_VERSION"
          echo "PASS: Expo CLI is installed"
