name: Test Expo CLI Installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          expo-version: latest
          expo-cache: false
          packager: npm
          patch-watchers: false
      - name: Assert Expo CLI is installed
        run: |
          echo "Checking expo CLI..."
          if ! command -v expo &>/dev/null; then
            echo "FAIL: expo CLI not found on PATH"
            exit 1
          fi
          VERSION=$(expo --version 2>&1 || true)
          echo "expo version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expo --version returned empty"
            exit 1
          fi
          echo "PASS: expo CLI is installed"
