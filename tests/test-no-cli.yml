name: Test action with no CLI versions specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          packager: npm
          patch-watchers: false
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with no CLI versions specified"
          echo "PASS: action ran without error when no CLI versions were given"
