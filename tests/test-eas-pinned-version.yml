name: Test EAS CLI pinned version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          eas-version: 16.0.0
          eas-cache: false
          packager: npm
          patch-watchers: false
      - name: Assert EAS CLI pinned version is installed
        run: |
          echo "Checking EAS CLI installation..."
          if ! command -v eas &>/dev/null; then
            echo "FAIL: eas command not found"
            exit 1
          fi
          EAS_VERSION=$(eas --version 2>&1 || true)
          echo "EAS version output: $EAS_VERSION"
          if echo "$EAS_VERSION" | grep -q "16.0.0"; then
            echo "PASS: EAS CLI 16.0.0 is installed"
          else
            echo "FAIL: Expected EAS CLI 16.0.0 but got: $EAS_VERSION"
            exit 1
          fi
