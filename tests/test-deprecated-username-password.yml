name: Test deprecated username and password inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          expo-version: latest
          username: fake-expo-user
          password: fake-expo-password
      - name: Assert action completed with deprecated inputs
        run: |
          echo "Action completed with deprecated username/password inputs"
          echo "PASS"
