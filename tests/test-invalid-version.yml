name: Test invalid eas-version fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          eas-version: 0.0.0-does-not-exist-999
          eas-cache: 'false'
          packager: npm
          patch-watchers: 'false'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for an unresolvable version"
            exit 1
          fi
          echo "PASS"
      - name: Assert eas was not installed
        run: |
          if [ -d "$RUNNER_TOOL_CACHE/eas-cli/0.0.0-does-not-exist-999" ]; then
            echo "FAIL: unexpected tool cache entry"
            exit 1
          fi
          echo "PASS"
