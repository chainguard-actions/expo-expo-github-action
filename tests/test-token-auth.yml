name: Test token authentication input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          expo-version: latest
          expo-cache: false
          eas-version: latest
          eas-cache: false
          token: fake-expo-token-for-testing
          patch-watchers: false
        continue-on-error: true
      - name: Assert action ran (token input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with token input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
