name: Test token authentication input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          expo-version: latest
          expo-cache: false
          token: fake-expo-token-for-testing
      - name: Assert expo CLI is installed
        run: |
          if ! command -v expo &>/dev/null && ! command -v npx &>/dev/null; then
            echo "FAIL: expo CLI not found"
            exit 1
          fi
          echo "PASS: expo CLI is available"
