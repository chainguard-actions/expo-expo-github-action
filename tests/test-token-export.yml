name: Test token is exported without CLI
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: test-expo-token-value
          patch-watchers: 'false'
      - name: Assert EXPO_TOKEN exported for later steps
        run: |
          echo "EXPO_TOKEN length: ${#EXPO_TOKEN}"
          if [ "$EXPO_TOKEN" != "test-expo-token-value" ]; then
            echo "FAIL: EXPO_TOKEN not exported with expected value"
            exit 1
          fi
          echo "PASS"
