name: Test EAS CLI Specific Version Installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          eas-version: 16.0.0
          eas-cache: false
          packager: npm
          patch-watchers: false
      - name: Assert EAS CLI is installed at correct version
        run: |
          echo "Checking eas CLI version..."
          if ! command -v eas &> /dev/null; then
            echo "FAIL: eas CLI not found in PATH"
            exit 1
          fi
          INSTALLED_VERSION=$(eas --version 2>&1 | head -1)
          echo "Installed version: $INSTALLED_VERSION"
          if echo "$INSTALLED_VERSION" | grep -q "16.0.0"; then
            echo "PASS: eas CLI version 16.0.0 is installed"
          else
            echo "FAIL: expected eas CLI version 16.0.0 but got: $INSTALLED_VERSION"
            exit 1
          fi
