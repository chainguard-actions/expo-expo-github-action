name: Test installing both Expo and EAS CLIs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          expo-version: latest
          expo-cache: false
          eas-version: latest
          eas-cache: false
          packager: npm
          patch-watchers: false
      - name: Assert CLIs are installed or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Checking Expo CLI installation..."
            if ! command -v expo >/dev/null 2>&1; then
              echo "FAIL: action succeeded but expo CLI not found on PATH"
              exit 1
            fi
            EXPO_VERSION=$(expo --version 2>&1 || true)
            echo "expo version: $EXPO_VERSION"
            if [ -z "$EXPO_VERSION" ]; then
              echo "FAIL: expo --version returned empty output"
              exit 1
            fi
            echo "PASS: Expo CLI is installed"

            echo "Checking EAS CLI installation..."
            if ! command -v eas >/dev/null 2>&1; then
              echo "FAIL: action succeeded but eas CLI not found on PATH"
              exit 1
            fi
            EAS_VERSION=$(eas --version 2>&1 || true)
            echo "eas version: $EAS_VERSION"
            if [ -z "$EAS_VERSION" ]; then
              echo "FAIL: eas --version returned empty output"
              exit 1
            fi
            echo "PASS: EAS CLI is installed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expo-cli may be deprecated or unavailable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
