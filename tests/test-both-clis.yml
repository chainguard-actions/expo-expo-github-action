name: Test installing both Expo and EAS CLIs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          expo-version: 6.3.10
          expo-cache: false
          eas-version: latest
          eas-cache: false
          packager: npm
          patch-watchers: false
      - name: Assert both CLIs are installed
        run: |
          echo "Checking Expo CLI..."
          if ! command -v expo &>/dev/null; then
            echo "FAIL: expo CLI not found in PATH"
            exit 1
          fi
          EXPO_VERSION=$(expo --version 2>&1 || true)
          echo "Expo version: $EXPO_VERSION"
          if [ -z "$EXPO_VERSION" ]; then
            echo "FAIL: expo --version returned empty output"
            exit 1
          fi

          echo "Checking EAS CLI..."
          if ! command -v eas &>/dev/null; then
            echo "FAIL: eas CLI not found in PATH"
            exit 1
          fi
          EAS_VERSION=$(eas --version 2>&1 || true)
          echo "EAS version: $EAS_VERSION"
          if [ -z "$EAS_VERSION" ]; then
            echo "FAIL: eas --version returned empty output"
            exit 1
          fi

          echo "PASS: Both CLIs are installed"
