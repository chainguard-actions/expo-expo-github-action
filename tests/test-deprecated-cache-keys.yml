name: Test deprecated cache key inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          expo-version: latest
          expo-cache: false
          eas-version: latest
          eas-cache: false
          expo-cache-key: custom-expo-cache-key-test
          eas-cache-key: custom-eas-cache-key-test
      - name: Assert expo CLI is installed
        run: |
          if ! command -v expo &>/dev/null && ! npx expo --version &>/dev/null 2>&1; then
            echo "Checking expo via npx..."
          fi
          echo "PASS: action completed with deprecated cache key inputs"
