name: Test deprecated cache key inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          expo-version: latest
          eas-version: latest
          expo-cache-key: custom-expo-cache-key
          eas-cache-key: custom-eas-cache-key
      - name: Assert action completed with deprecated cache key inputs
        run: |
          echo "Action completed with deprecated cache key inputs"
          echo "PASS"
