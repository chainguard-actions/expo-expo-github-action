name: Test auth inputs (token, username, password)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          expo-version: latest
          expo-cache: false
          packager: npm
          patch-watchers: false
          token: fake-token-for-testing
          username: fake-username
          password: fake-password
      - name: Assert action completed
        run: |
          echo "Action completed with auth inputs provided"
          echo "PASS: action ran with token, username, and password inputs"
