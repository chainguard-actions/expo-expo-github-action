name: Test auth and deprecated cache-key inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          eas-version: latest
          eas-cache: false
          eas-cache-key: custom-eas-cache-key
          expo-version: latest
          expo-cache: false
          expo-cache-key: custom-expo-cache-key
          packager: npm
          token: fake-expo-token
          username: fake-expo-username
          password: fake-expo-password
          patch-watchers: false
      - name: Assert EAS CLI is installed
        run: |
          if ! command -v eas &>/dev/null; then
            echo "FAIL: eas CLI not found"
            exit 1
          fi
          echo "PASS: eas CLI found at $(command -v eas)"
      - name: Assert Expo CLI is installed
        run: |
          if ! command -v expo &>/dev/null; then
            echo "FAIL: expo CLI not found"
            exit 1
          fi
          echo "PASS: expo CLI found at $(command -v expo)"
