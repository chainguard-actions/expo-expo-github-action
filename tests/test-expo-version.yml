name: Test expo-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          expo-version: latest
          expo-cache: false
          expo-cache-key: expo-cache-key-test
          packager: npm
          patch-watchers: false
      - name: Assert expo CLI is available
        run: |
          echo "Checking expo CLI installation..."
          if ! command -v expo &> /dev/null; then
            echo "FAIL: expo CLI not found in PATH"
            exit 1
          fi
          echo "PASS: expo CLI is available"
