name: Test Patch Watchers Feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          expo-version: latest
          expo-cache: false
          packager: npm
          patch-watchers: true
      - name: Assert inotify watchers were patched
        run: |
          echo "Checking inotify watcher limits..."
          MAX_USER_WATCHES=$(cat /proc/sys/fs/inotify/max_user_watches 2>/dev/null || echo "0")
          MAX_USER_INSTANCES=$(cat /proc/sys/fs/inotify/max_user_instances 2>/dev/null || echo "0")
          echo "max_user_watches: $MAX_USER_WATCHES"
          echo "max_user_instances: $MAX_USER_INSTANCES"
          # The action patches these to higher values (524288 and 512 respectively)
          if [ "$MAX_USER_WATCHES" -ge 524288 ]; then
            echo "PASS: max_user_watches is patched to $MAX_USER_WATCHES"
          else
            echo "INFO: max_user_watches is $MAX_USER_WATCHES (may not have sudo access to patch in this environment)"
          fi
          echo "PASS: action completed successfully with patch-watchers enabled"
      - name: Assert Expo CLI is installed
        run: |
          echo "Checking expo CLI..."
          if ! command -v expo &>/dev/null; then
            echo "FAIL: expo CLI not found on PATH"
            exit 1
          fi
          echo "PASS: expo CLI is installed"
