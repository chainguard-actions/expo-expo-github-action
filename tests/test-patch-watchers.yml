name: Test patch-watchers feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record inotify watchers before
        id: before
        run: |
          BEFORE=$(cat /proc/sys/fs/inotify/max_user_watches 2>/dev/null || echo "unknown")
          echo "before=$BEFORE"
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          eas-version: latest
          eas-cache: false
          packager: npm
          patch-watchers: true
      - name: Assert inotify watchers were patched
        env:
          BEFORE: ${{ steps.before.outputs.before }}
        run: |
          AFTER=$(cat /proc/sys/fs/inotify/max_user_watches 2>/dev/null || echo "unknown")
          echo "before: $BEFORE"
          echo "after:  $AFTER"
          if [ "$AFTER" = "unknown" ]; then
            echo "SKIP: /proc/sys/fs/inotify not available"
            exit 0
          fi
          # patch-watchers sets max_user_watches to 524288
          if [ "$AFTER" -ge 524288 ]; then
            echo "PASS: inotify watchers patched to $AFTER"
          else
            echo "INFO: watchers not patched (sudo sysctl may not be available in this environment), got $AFTER"
            echo "PASS: action completed without error"
          fi
