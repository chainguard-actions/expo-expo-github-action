name: Test expo-version and token inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          expo-version: latest
          token: fake-test-token
          expo-cache: false
          patch-watchers: false
      - name: Assert expo CLI is available
        run: |
          echo "Checking expo CLI is installed..."
          if ! command -v expo &> /dev/null; then
            echo "FAIL: expo CLI not found in PATH"
            exit 1
          fi
          echo "PASS: expo CLI is available"
