name: Test basic Expo CLI installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          expo-version: 5.4.12
          expo-cache: false
          packager: npm
          patch-watchers: false
      - name: Assert Expo CLI is installed
        run: |
          echo "Checking expo CLI is available..."
          if ! command -v expo &> /dev/null; then
            echo "FAIL: expo CLI not found in PATH"
            exit 1
          fi
          echo "PASS: expo CLI is available"
          expo --version
