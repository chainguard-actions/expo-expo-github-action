name: Test project and channel inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project: "."
          channel: "default"
          comment: "false"
      - name: Assert action ran with project and channel inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROJECT_SLUG: ${{ steps.action.outputs.projectSlug }}
          PROJECT_LINK: ${{ steps.action.outputs.projectLink }}
        run: |
          echo "outcome: $OUTCOME"
          echo "projectSlug: $PROJECT_SLUG"
          echo "projectLink: $PROJECT_LINK"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with project and channel inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without a real Expo project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
