name: Test message-id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          project: .
          comment: "false"
          message-id: "expo-preview-unique-id-123"
        continue-on-error: true
      - name: Assert action ran with message-id input or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MESSAGE_ID: ${{ steps.action.outputs.messageId }}
        run: |
          echo "outcome: $OUTCOME"
          echo "messageId: $MESSAGE_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with message-id input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo / no real PR)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
