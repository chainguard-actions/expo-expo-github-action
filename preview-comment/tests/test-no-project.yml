name: Test with no project path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          comment: "false"
          github-token: ${{ github.token }}

      - name: Assert action ran (no project path)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROJECT_SLUG: ${{ steps.action.outputs.projectSlug }}
          MESSAGE: ${{ steps.action.outputs.message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "projectSlug: $PROJECT_SLUG"
          echo "message: $MESSAGE"

          # Without a project path, the action may fail to resolve project info
          # or succeed with empty outputs — both are acceptable under the harness
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (no project path, outputs may be empty)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no project path or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
