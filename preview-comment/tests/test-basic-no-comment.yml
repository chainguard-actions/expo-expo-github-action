name: Test basic usage with comment disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy Expo project fixture into workspace
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/expo-project" "$GITHUB_WORKSPACE/expo-project"

      - id: action
        uses: .
        with:
          project: expo-project
          channel: default
          comment: "false"
        continue-on-error: true

      - name: Assert action ran and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROJECT_SLUG: ${{ steps.action.outputs.projectSlug }}
          PROJECT_NAME: ${{ steps.action.outputs.projectName }}
          PROJECT_LINK: ${{ steps.action.outputs.projectLink }}
          PROJECT_QR: ${{ steps.action.outputs.projectQR }}
          MESSAGE: ${{ steps.action.outputs.message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "projectSlug: $PROJECT_SLUG"
          echo "projectName: $PROJECT_NAME"
          echo "projectLink: $PROJECT_LINK"
          echo "projectQR: $PROJECT_QR"
          echo "message: $MESSAGE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PROJECT_SLUG" ] && [ -z "$PROJECT_NAME" ]; then
              echo "FAIL: action succeeded but no project outputs were set"
              exit 1
            fi
            echo "PASS: action succeeded with project outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in non-PR/sentinel-repo context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
