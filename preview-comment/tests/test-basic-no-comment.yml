name: Test basic usage with comment disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          project: tests/fixtures/expo-project
          channel: default
          comment: "false"

      - name: Assert action ran (outputs set or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          QR: ${{ steps.action.outputs.projectQR }}
          LINK: ${{ steps.action.outputs.projectLink }}
          MESSAGE: ${{ steps.action.outputs.message }}
          MESSAGE_ID: ${{ steps.action.outputs.messageId }}
        run: |
          echo "outcome: $OUTCOME"
          echo "projectQR: $QR"
          echo "projectLink: $LINK"
          echo "message: $MESSAGE"
          echo "messageId: $MESSAGE_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$QR" ]; then
              echo "FAIL: action succeeded but projectQR output is empty"
              exit 1
            fi
            echo "PASS: projectQR is set to '$QR'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Expo project or API access)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
