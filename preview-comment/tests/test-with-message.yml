name: Test with custom message template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project: .
          message: "🚀 Preview available at {projectLink}"
          comment: "false"
          github-token: ${{ github.token }}
      - name: Assert action ran with custom message input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MSG: ${{ steps.action.outputs.message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "message output: $MSG"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$MSG" ]; then
              echo "FAIL: action succeeded but message output is empty"
              exit 1
            fi
            echo "PASS: got message '$MSG'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or no Expo project config)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
