name: Test channel input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          project: .
          channel: staging
          comment: "false"
        continue-on-error: true
      - name: Assert action ran with channel input or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROJECT_LINK: ${{ steps.action.outputs.projectLink }}
          PROJECT_QR: ${{ steps.action.outputs.projectQR }}
        run: |
          echo "outcome: $OUTCOME"
          echo "projectLink: $PROJECT_LINK"
          echo "projectQR: $PROJECT_QR"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with channel input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo / no real PR)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
