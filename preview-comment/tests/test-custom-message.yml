name: Test preview-comment with custom message template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          project: tests/fixtures/expo-project
          channel: staging
          comment: "false"
          message: "Preview available at {projectLink} - scan QR: {projectQR}"
          message-id: "custom-preview-{projectSlug}"

      - name: Assert action ran with custom message or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MESSAGE: ${{ steps.action.outputs.message }}
          MESSAGE_ID: ${{ steps.action.outputs.messageId }}
          PROJECT_LINK: ${{ steps.action.outputs.projectLink }}
        run: |
          echo "outcome: $OUTCOME"
          echo "message: $MESSAGE"
          echo "messageId: $MESSAGE_ID"
          echo "projectLink: $PROJECT_LINK"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$MESSAGE" ]; then
              echo "FAIL: message output is empty on success"
              exit 1
            fi
            if [ -z "$MESSAGE_ID" ]; then
              echo "FAIL: messageId output is empty on success"
              exit 1
            fi
            echo "PASS: action succeeded with message='$MESSAGE' messageId='$MESSAGE_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or Expo API not reachable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
