name: Test custom message input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          comment: "false"
          message: "🚀 Preview is ready! Scan the QR code below."
          message-id: "custom-message-test"
      - name: Assert action ran with custom message input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MESSAGE: ${{ steps.action.outputs.message }}
          PROJECT_SLUG: ${{ steps.action.outputs.projectSlug }}
        run: |
          echo "outcome: $OUTCOME"
          echo "message: $MESSAGE"
          echo "projectSlug: $PROJECT_SLUG"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under workflow_dispatch / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
