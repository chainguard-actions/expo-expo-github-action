name: Test custom message template with comment disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          project: tests/fixtures/expo-project
          channel: preview
          comment: "false"
          message: "Scan this QR code: {projectQR}"

      - name: Assert action ran (message set or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MESSAGE: ${{ steps.action.outputs.message }}
          QR: ${{ steps.action.outputs.projectQR }}
        run: |
          echo "outcome: $OUTCOME"
          echo "message: $MESSAGE"
          echo "projectQR: $QR"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$MESSAGE" ]; then
              echo "FAIL: action succeeded but message output is empty"
              exit 1
            fi
            echo "PASS: message is set to '$MESSAGE'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Expo project or API access)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
