name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          project: .
          comment: "false"
        continue-on-error: true
      - name: Assert action ran and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROJECT_OWNER: ${{ steps.action.outputs.projectOwner }}
          PROJECT_NAME: ${{ steps.action.outputs.projectName }}
          PROJECT_SLUG: ${{ steps.action.outputs.projectSlug }}
          PROJECT_QR: ${{ steps.action.outputs.projectQR }}
          PROJECT_LINK: ${{ steps.action.outputs.projectLink }}
        run: |
          echo "outcome: $OUTCOME"
          echo "projectOwner: $PROJECT_OWNER"
          echo "projectName: $PROJECT_NAME"
          echo "projectSlug: $PROJECT_SLUG"
          echo "projectQR: $PROJECT_QR"
          echo "projectLink: $PROJECT_LINK"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo / no real PR)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
