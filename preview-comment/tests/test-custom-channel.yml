name: Test custom channel and message-id with comment disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy Expo project fixture into workspace
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/expo-project" "$GITHUB_WORKSPACE/expo-project"

      - id: action
        uses: .
        with:
          project: expo-project
          channel: pr-42
          comment: "false"
          message-id: "expo-preview-pr-42"
        continue-on-error: true

      - name: Assert action ran with custom channel
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROJECT_LINK: ${{ steps.action.outputs.projectLink }}
          PROJECT_QR: ${{ steps.action.outputs.projectQR }}
          MESSAGE_ID: ${{ steps.action.outputs.messageId }}
          MESSAGE: ${{ steps.action.outputs.message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "projectLink: $PROJECT_LINK"
          echo "projectQR: $PROJECT_QR"
          echo "messageId: $MESSAGE_ID"
          echo "message: $MESSAGE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in non-PR/sentinel-repo context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
