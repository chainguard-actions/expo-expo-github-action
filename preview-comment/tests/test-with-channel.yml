name: Test with channel input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          project: tests/fixtures/expo-project
          channel: staging
          comment: "false"
          github-token: ${{ github.token }}

      - name: Assert action ran with channel input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROJECT_SLUG: ${{ steps.action.outputs.projectSlug }}
          PROJECT_LINK: ${{ steps.action.outputs.projectLink }}
          PROJECT_QR: ${{ steps.action.outputs.projectQR }}
          MESSAGE: ${{ steps.action.outputs.message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "projectSlug: $PROJECT_SLUG"
          echo "projectLink: $PROJECT_LINK"
          echo "projectQR: $PROJECT_QR"
          echo "message: $MESSAGE"

          if [ "$OUTCOME" = "success" ]; then
            # If the action succeeded, at least one output should be set
            if [ -z "$PROJECT_SLUG" ] && [ -z "$PROJECT_LINK" ] && [ -z "$MESSAGE" ]; then
              echo "FAIL: action succeeded but all outputs are empty"
              exit 1
            fi
            # If projectLink is set, it should reference the channel
            if [ -n "$PROJECT_LINK" ]; then
              echo "projectLink is set: $PROJECT_LINK"
            fi
            echo "PASS: action succeeded with channel input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or missing Expo credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
