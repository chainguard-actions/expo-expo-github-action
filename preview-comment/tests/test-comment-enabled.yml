name: Test with comment enabled (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          project: tests/fixtures/expo-project
          channel: production
          comment: "true"

      - name: Assert action ran (outputs set or failed gracefully on sentinel repo without PR)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          QR: ${{ steps.action.outputs.projectQR }}
          LINK: ${{ steps.action.outputs.projectLink }}
        run: |
          echo "outcome: $OUTCOME"
          echo "projectQR: $QR"
          echo "projectLink: $LINK"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$QR" ]; then
              echo "FAIL: action succeeded but projectQR output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with projectQR set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo without a real PR)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
