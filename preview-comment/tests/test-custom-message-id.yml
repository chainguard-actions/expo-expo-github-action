name: Test custom message-id with comment disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          project: tests/fixtures/expo-project
          channel: staging
          comment: "false"
          message-id: "my-custom-preview-{projectOwner}-{projectSlug}"

      - name: Assert action ran (messageId set or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MESSAGE_ID: ${{ steps.action.outputs.messageId }}
          QR: ${{ steps.action.outputs.projectQR }}
          LINK: ${{ steps.action.outputs.projectLink }}
        run: |
          echo "outcome: $OUTCOME"
          echo "messageId: $MESSAGE_ID"
          echo "projectQR: $QR"
          echo "projectLink: $LINK"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$MESSAGE_ID" ]; then
              echo "FAIL: action succeeded but messageId output is empty"
              exit 1
            fi
            echo "PASS: messageId is set to '$MESSAGE_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Expo project or API access)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
