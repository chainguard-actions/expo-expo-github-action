name: Test failure when expo config fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install failing fake expo CLI
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/expo" <<'EOF'
          #!/bin/sh
          echo "Error: no app config found" >&2
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/expo"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          comment: "false"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SLUG: ${{ steps.action.outputs.projectSlug }}
        run: |
          echo "outcome: $OUTCOME"
          echo "slug: $SLUG"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when expo config fails"
            exit 1
          fi
          if [ -n "$SLUG" ]; then
            echo "FAIL: projectSlug should not be set on failure"
            exit 1
          fi
          echo "PASS"
