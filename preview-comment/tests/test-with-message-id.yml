name: Test with message-id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          comment: "false"
          message-id: "expo-preview-test-unique-id"

      - name: Assert action ran with message-id input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MESSAGE_ID: ${{ steps.action.outputs.messageId }}
          MESSAGE: ${{ steps.action.outputs.message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "messageId: $MESSAGE_ID"
          echo "message: $MESSAGE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with message-id input"
            # If the action succeeded, check if messageId output is set
            if [ -n "$MESSAGE_ID" ]; then
              echo "PASS: messageId output is set: $MESSAGE_ID"
            else
              echo "INFO: messageId output is empty (may be expected without Expo config)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo or missing Expo config)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
