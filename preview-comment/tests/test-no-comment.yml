name: Test preview-comment with comment disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          project: tests/fixtures/expo-project
          channel: production
          comment: "false"

      - name: Assert action ran and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROJECT_OWNER: ${{ steps.action.outputs.projectOwner }}
          PROJECT_NAME: ${{ steps.action.outputs.projectName }}
          PROJECT_SLUG: ${{ steps.action.outputs.projectSlug }}
          PROJECT_QR: ${{ steps.action.outputs.projectQR }}
          PROJECT_LINK: ${{ steps.action.outputs.projectLink }}
          MESSAGE: ${{ steps.action.outputs.message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "projectOwner: $PROJECT_OWNER"
          echo "projectName: $PROJECT_NAME"
          echo "projectSlug: $PROJECT_SLUG"
          echo "projectQR: $PROJECT_QR"
          echo "projectLink: $PROJECT_LINK"
          echo "message: $MESSAGE"

          if [ "$OUTCOME" = "success" ]; then
            # Validate that key outputs are set
            if [ -z "$PROJECT_SLUG" ]; then
              echo "FAIL: projectSlug output is empty"
              exit 1
            fi
            if [ -z "$PROJECT_QR" ]; then
              echo "FAIL: projectQR output is empty"
              exit 1
            fi
            if [ -z "$PROJECT_LINK" ]; then
              echo "FAIL: projectLink output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with outputs set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or Expo API not reachable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
