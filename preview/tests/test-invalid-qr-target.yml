name: Test invalid qr-target fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare empty app directory
        run: mkdir -p "$GITHUB_WORKSPACE/test-app-qr"
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: eas update --auto
          qr-target: not-a-valid-target
          comment: "false"
          working-directory: test-app-qr
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GROUP: ${{ steps.action.outputs.groupId }}
        run: |
          echo "outcome: $OUTCOME"
          echo "groupId: $GROUP"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid qr-target"
            exit 1
          fi
          if [ -n "$GROUP" ]; then
            echo "FAIL: no update should have been created"
            exit 1
          fi
          echo "PASS"
