name: Test comment-id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: "eas update --branch preview --message 'Test update'"
          comment: "false"
          comment-id: "expo-preview-{branch}"
          working-directory: ${{ github.workspace }}
      - name: Assert action ran with comment-id input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment without EAS credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
