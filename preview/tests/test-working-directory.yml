name: Test with custom working directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake Expo app directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/my-expo-app"
          echo '{"name":"my-app","version":"1.0.0","expo":{"slug":"my-app","version":"1.0.0"}}' \
            > "$GITHUB_WORKSPACE/my-expo-app/app.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: eas update --auto
          comment: "false"
          working-directory: ${{ github.workspace }}/my-expo-app

      - name: Assert action ran with custom working directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom working directory"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no EAS auth/project in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
