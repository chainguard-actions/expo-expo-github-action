name: Test working directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory to use as working directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/my-expo-app"
          echo '{"name":"my-expo-app","version":"1.0.0"}' > "$GITHUB_WORKSPACE/my-expo-app/package.json"
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: update --branch test --message "Working dir test"
          comment: false
          working-directory: ${{ github.workspace }}/my-expo-app
          github-token: ${{ github.token }}
      - name: Assert action ran with custom working directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom working directory"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without EAS credentials/project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
