name: Test app-scheme input (deprecated)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: eas update --auto
          comment: false
          app-scheme: myapp
          working-directory: ${{ github.workspace }}
      - name: Assert action ran with app-scheme input (graceful failure expected without EAS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROJECT_SCHEME: ${{ steps.action.outputs.projectScheme }}
        run: |
          echo "outcome: $OUTCOME"
          echo "projectScheme: $PROJECT_SCHEME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no EAS credentials / real Expo project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
