name: Test deprecated app-scheme with invalid command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare app directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-app-scheme"
          echo '{"expo":{"name":"test","slug":"test","scheme":"testscheme"}}' > "$GITHUB_WORKSPACE/test-app-scheme/app.json"
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: echo not-an-eas-update
          comment: "false"
          app-scheme: "myscheme"
          working-directory: test-app-scheme
      - name: Assert action failed without outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GROUP: ${{ steps.action.outputs.groupId }}
        run: |
          echo "outcome: $OUTCOME"
          echo "groupId: $GROUP"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for an invalid command"
            exit 1
          fi
          if [ -n "$GROUP" ]; then
            echo "FAIL: no update should have been created"
            exit 1
          fi
          echo "PASS"
