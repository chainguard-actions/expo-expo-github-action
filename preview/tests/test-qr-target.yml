name: Test qr-target input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: eas update --auto
          comment: false
          qr-target: expo-go
          working-directory: ${{ github.workspace }}
      - name: Assert action ran with qr-target input (graceful failure expected without EAS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          QR: ${{ steps.action.outputs.qr }}
        run: |
          echo "outcome: $OUTCOME"
          echo "qr: $QR"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no EAS credentials / real Expo project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
