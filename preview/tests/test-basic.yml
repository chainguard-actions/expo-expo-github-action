name: Test basic usage - command input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: eas update --branch preview --message "Test update"
          comment: false
          github-token: ${{ github.token }}

      - name: Assert action ran (outputs set or failed gracefully without EAS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROJECT_ID: ${{ steps.action.outputs.projectId }}
          PROJECT_NAME: ${{ steps.action.outputs.projectName }}
        run: |
          echo "outcome: $OUTCOME"
          echo "projectId: $PROJECT_ID"
          echo "projectName: $PROJECT_NAME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without EAS credentials/project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
