name: Test qr-target expo-go
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: update --branch test --message "QR target test"
          comment: false
          qr-target: expo-go
          github-token: ${{ github.token }}
      - name: Assert action ran with qr-target expo-go
        env:
          OUTCOME: ${{ steps.action.outcome }}
          QR_OUT: ${{ steps.action.outputs.qr }}
        run: |
          echo "outcome: $OUTCOME"
          echo "qr output: $QR_OUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with qr-target=expo-go"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without EAS credentials/project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
