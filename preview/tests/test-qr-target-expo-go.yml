name: Test QR target expo-go
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: eas update --branch preview --message "Expo Go QR test"
          comment: "false"
          qr-target: expo-go

      - name: Assert action ran with expo-go qr-target (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          QR_OUTPUT: ${{ steps.action.outputs.qr }}
        run: |
          echo "outcome: $OUTCOME"
          echo "qr output: $QR_OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with expo-go qr-target"
            if [ -n "$QR_OUTPUT" ]; then
              echo "QR URL: $QR_OUTPUT"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no EAS credentials or project configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
