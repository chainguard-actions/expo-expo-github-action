name: Test comment disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: eas update --branch test --message "No comment test"
          comment: "false"
          github-token: ${{ github.token }}

      - name: Assert action ran with comment disabled (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_OUTPUT: ${{ steps.action.outputs.comment }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment output: $COMMENT_OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with comment disabled"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no EAS credentials or project configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
