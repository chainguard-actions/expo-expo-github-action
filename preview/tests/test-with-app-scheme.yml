name: Test with app scheme and comment id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: "eas update --branch preview --message 'App scheme test'"
          app-scheme: "myapp"
          comment: "false"
          comment-id: "expo-preview-{projectId}"
          github-token: ${{ github.token }}

      - name: Assert action ran with app-scheme input (fails gracefully without EAS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SCHEME: ${{ steps.action.outputs.projectScheme }}
        run: |
          echo "outcome: $OUTCOME"
          echo "projectScheme: $SCHEME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without EAS credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
