name: Test environment and auto-submit-builds inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          profile: staging
          branch: staging
          environment: staging
          auto-submit-builds: "false"
          github-token: ${{ github.token }}
      - name: Assert action ran and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ANDROID_BUILD_ID: ${{ steps.action.outputs.android-build-id }}
          IOS_BUILD_ID: ${{ steps.action.outputs.ios-build-id }}
          ANDROID_NEW_BUILD: ${{ steps.action.outputs.android-did-start-new-build }}
          IOS_NEW_BUILD: ${{ steps.action.outputs.ios-did-start-new-build }}
        run: |
          echo "outcome: $OUTCOME"
          echo "android-build-id: $ANDROID_BUILD_ID"
          echo "ios-build-id: $IOS_BUILD_ID"
          echo "android-did-start-new-build: $ANDROID_NEW_BUILD"
          echo "ios-did-start-new-build: $IOS_NEW_BUILD"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with environment and auto-submit-builds inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real EAS project/credentials in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
