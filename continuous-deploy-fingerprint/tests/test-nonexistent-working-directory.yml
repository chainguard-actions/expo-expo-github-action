name: Test fails with nonexistent working directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          profile: preview
          branch: preview
          platform: ios
          working-directory: ${{ github.workspace }}/does-not-exist
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IOS_BUILD_ID: ${{ steps.action.outputs.ios-build-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ios-build-id: $IOS_BUILD_ID"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing working directory, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$IOS_BUILD_ID" ]; then
            echo "FAIL: no build id expected"
            exit 1
          fi
          echo "PASS"
