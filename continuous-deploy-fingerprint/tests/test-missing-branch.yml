name: Test fails when required branch input is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: mkdir -p "$GITHUB_WORKSPACE/empty-app"
      - id: action
        uses: .
        continue-on-error: true
        with:
          profile: production
          working-directory: ${{ github.workspace }}/empty-app
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UPDATE_OUTPUT: ${{ steps.action.outputs.update-output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "update-output: $UPDATE_OUTPUT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when branch is missing, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$UPDATE_OUTPUT" ]; then
            echo "FAIL: no update should have been published"
            exit 1
          fi
          echo "PASS"
