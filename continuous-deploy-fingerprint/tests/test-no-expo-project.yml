name: Test fails without an Expo project
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create empty working directory (no Expo project, no EXPO_TOKEN)
        run: mkdir -p "$GITHUB_WORKSPACE/empty-app"
      - id: action
        uses: .
        continue-on-error: true
        with:
          profile: production
          branch: production
          platform: android
          working-directory: ${{ github.workspace }}/empty-app
      - name: Assert action failed and started no build
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ANDROID_NEW_BUILD: ${{ steps.action.outputs.android-did-start-new-build }}
          IOS_NEW_BUILD: ${{ steps.action.outputs.ios-did-start-new-build }}
        run: |
          echo "outcome: $OUTCOME"
          echo "android-did-start-new-build: $ANDROID_NEW_BUILD"
          echo "ios-did-start-new-build: $IOS_NEW_BUILD"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure without an Expo project, got '$OUTCOME'"
            exit 1
          fi
          if [ "$ANDROID_NEW_BUILD" = "true" ] || [ "$IOS_NEW_BUILD" = "true" ]; then
            echo "FAIL: no build should have been started"
            exit 1
          fi
          echo "PASS"
