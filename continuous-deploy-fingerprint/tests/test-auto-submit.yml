name: Test auto-submit-builds input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          profile: production
          branch: main
          platform: all
          auto-submit-builds: "true"
          github-token: ${{ github.token }}

      - name: Assert action ran with auto-submit-builds or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ANDROID_FINGERPRINT: ${{ steps.action.outputs.android-fingerprint }}
          IOS_FINGERPRINT: ${{ steps.action.outputs.ios-fingerprint }}
          ANDROID_BUILD_ID: ${{ steps.action.outputs.android-build-id }}
          IOS_BUILD_ID: ${{ steps.action.outputs.ios-build-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "android-fingerprint: $ANDROID_FINGERPRINT"
          echo "ios-fingerprint: $IOS_FINGERPRINT"
          echo "android-build-id: $ANDROID_BUILD_ID"
          echo "ios-build-id: $IOS_BUILD_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ANDROID_FINGERPRINT" ] && [ -z "$IOS_FINGERPRINT" ]; then
              echo "FAIL: action succeeded but no fingerprint outputs were set"
              exit 1
            fi
            echo "PASS: action succeeded with fingerprint outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without EAS credentials or real Expo project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
