name: Test no comment payload fails with clear error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed because no issue comment context exists
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act the event is always workflow_dispatch, so there is no
          # issue_comment payload; the action must refuse to run.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail without an issue_comment context, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
