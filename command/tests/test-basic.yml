name: Test basic usage - default token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run expo command action with default token
        id: action
        uses: .
        continue-on-error: true
        # No inputs — github-token defaults to github.token
        # The action is designed for issue_comment events and makes repo-scoped
        # API calls. Under the harness the sentinel GITHUB_REPOSITORY does not
        # exist on GitHub, so the action is expected to fail gracefully.

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / no issue_comment context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
