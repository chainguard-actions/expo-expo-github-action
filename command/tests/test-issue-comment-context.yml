name: Test issue_comment event context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake issue_comment event payload
        run: |
          mkdir -p /tmp/event
          cat > /tmp/event/issue_comment.json <<'EOF'
          {
            "action": "created",
            "issue": {
              "number": 1,
              "pull_request": {
                "url": "https://api.github.com/repos/test/test/pulls/1"
              }
            },
            "comment": {
              "id": 1,
              "body": "/eas build",
              "user": {
                "login": "test-user"
              }
            },
            "repository": {
              "full_name": "test/test"
            }
          }
          EOF

      - name: Run expo command action with issue_comment context
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
        env:
          GITHUB_EVENT_NAME: issue_comment
          GITHUB_EVENT_PATH: /tmp/event/issue_comment.json

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action makes repo-scoped GitHub API calls. Under the harness the
          # sentinel repo does not exist on GitHub, so the action is expected to
          # fail gracefully (not crash the runner with an unhandled exception).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
