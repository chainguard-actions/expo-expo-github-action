name: Test explicit github-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
      - name: Assert action rejected non-issue_comment event with explicit token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The token is accepted as input, but the workflow_dispatch event
          # (forced by act) has no issue comment, so the action must fail.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure without issue_comment context, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
