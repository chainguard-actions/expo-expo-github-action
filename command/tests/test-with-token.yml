name: Test with explicit github-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run expo command action with explicit github-token
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran with explicit token (succeeds or fails gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with explicit token"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under workflow_dispatch event, not issue_comment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
