name: Test custom github-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run expo command action with explicit github-token
        id: action
        uses: .
        continue-on-error: true
        with:
          # Pass the real token explicitly (same as the default) to verify
          # the input is accepted without error.
          github-token: ${{ github.token }}
        # The action is designed for issue_comment events on PRs.
        # When triggered via workflow_dispatch it will exit early or fail
        # gracefully because there is no PR comment context available.

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with explicit token"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no issue_comment context available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
