name: Test basic fingerprint usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          packager: npm
          fingerprint-installation-cache: false

      - name: Assert action ran and produced current-fingerprint or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CURRENT_FP: ${{ steps.action.outputs.current-fingerprint }}
          CURRENT_COMMIT: ${{ steps.action.outputs.current-git-commit }}
        run: |
          echo "outcome: $OUTCOME"
          echo "current-fingerprint: $CURRENT_FP"
          echo "current-git-commit: $CURRENT_COMMIT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CURRENT_FP" ]; then
              echo "FAIL: action succeeded but current-fingerprint is empty"
              exit 1
            fi
            echo "PASS: got current-fingerprint '$CURRENT_FP'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
