name: Test fingerprint-diff output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: fingerprint
        uses: .
        continue-on-error: true
        with:
          packager: yarn
          github-token: ${{ github.token }}
          fingerprint-version: latest
          fingerprint-installation-cache: "false"
          fingerprint-db-cache-key: fingerprint-db-test-diff-output

      - name: Assert fingerprint-diff output is valid JSON array or empty on success
        env:
          OUTCOME: ${{ steps.fingerprint.outcome }}
          DIFF: ${{ steps.fingerprint.outputs.fingerprint-diff }}
        run: |
          echo "outcome: $OUTCOME"
          echo "fingerprint-diff: $DIFF"
          if [ "$OUTCOME" = "success" ]; then
            # If action succeeded, fingerprint-diff should be a JSON array (possibly empty [])
            if [ -n "$DIFF" ]; then
              # Validate it looks like a JSON array
              if echo "$DIFF" | grep -qE '^\['; then
                echo "PASS: fingerprint-diff is a JSON array: $DIFF"
              else
                echo "FAIL: fingerprint-diff is not a JSON array: $DIFF"
                exit 1
              fi
            else
              # Empty output is acceptable (no diff computed on first run)
              echo "PASS: fingerprint-diff is empty (no previous fingerprint to compare)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or first run without cache)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
