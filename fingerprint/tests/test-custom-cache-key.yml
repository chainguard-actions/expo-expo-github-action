name: Test fingerprint with custom cache key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: fingerprint
        uses: .
        continue-on-error: true
        with:
          packager: yarn
          github-token: ${{ github.token }}
          working-directory: ${{ github.workspace }}
          fingerprint-version: latest
          fingerprint-installation-cache: "false"
          fingerprint-db-cache-key: my-custom-fingerprint-db-key

      - name: Assert action ran with custom cache key or failed gracefully
        env:
          OUTCOME: ${{ steps.fingerprint.outcome }}
          CURRENT_FP: ${{ steps.fingerprint.outputs.current-fingerprint }}
        run: |
          echo "outcome: $OUTCOME"
          echo "current-fingerprint: $CURRENT_FP"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CURRENT_FP" ]; then
              echo "FAIL: action succeeded but current-fingerprint output is empty"
              exit 1
            fi
            echo "PASS: action ran with custom cache key, current-fingerprint='$CURRENT_FP'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
