name: Test custom working directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Expo-like project in a subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/my-expo-app"
          cat > "$GITHUB_WORKSPACE/my-expo-app/package.json" <<'EOF'
          {
            "name": "my-expo-app",
            "version": "1.0.0",
            "dependencies": {
              "expo": "~50.0.0"
            }
          }
          EOF

      - id: fingerprint
        uses: .
        continue-on-error: true
        with:
          packager: yarn
          working-directory: ${{ github.workspace }}/my-expo-app
          fingerprint-version: latest
          fingerprint-installation-cache: "false"
          fingerprint-db-cache-key: fingerprint-db-test-workdir

      - name: Assert action ran with custom working directory
        env:
          OUTCOME: ${{ steps.fingerprint.outcome }}
          DIFF: ${{ steps.fingerprint.outputs.fingerprint-diff }}
        run: |
          echo "outcome: $OUTCOME"
          echo "fingerprint-diff: $DIFF"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom working directory"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo without full Expo setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
