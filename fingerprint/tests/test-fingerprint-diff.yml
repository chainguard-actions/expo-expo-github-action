name: Test fingerprint diff between commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get commit hashes for diff test
        id: commits
        run: |
          CURRENT=$(git rev-parse HEAD)
          # Use HEAD as both previous and current to test with a known-good pair
          PREVIOUS=$(git rev-parse HEAD)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT
          echo "current commit: $CURRENT"
          echo "previous commit: $PREVIOUS"

      - id: fingerprint
        uses: .
        continue-on-error: true
        with:
          packager: yarn
          github-token: ${{ github.token }}
          working-directory: ${{ github.workspace }}
          fingerprint-version: latest
          fingerprint-installation-cache: "false"
          current-git-commit: ${{ steps.commits.outputs.current }}
          previous-git-commit: ${{ steps.commits.outputs.previous }}

      - name: Assert action ran and produced diff outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.fingerprint.outcome }}
          CURRENT_FP: ${{ steps.fingerprint.outputs.current-fingerprint }}
          PREVIOUS_FP: ${{ steps.fingerprint.outputs.previous-fingerprint }}
          CURRENT_COMMIT: ${{ steps.fingerprint.outputs.current-git-commit }}
          PREVIOUS_COMMIT: ${{ steps.fingerprint.outputs.previous-git-commit }}
          FP_DIFF: ${{ steps.fingerprint.outputs.fingerprint-diff }}
        run: |
          echo "outcome: $OUTCOME"
          echo "current-fingerprint: $CURRENT_FP"
          echo "previous-fingerprint: $PREVIOUS_FP"
          echo "current-git-commit: $CURRENT_COMMIT"
          echo "previous-git-commit: $PREVIOUS_COMMIT"
          echo "fingerprint-diff: $FP_DIFF"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CURRENT_FP" ]; then
              echo "FAIL: action succeeded but current-fingerprint output is empty"
              exit 1
            fi
            echo "PASS: fingerprint diff scenario completed, current-fingerprint='$CURRENT_FP'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
