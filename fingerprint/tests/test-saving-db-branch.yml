name: Test saving-db-branch input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          saving-db-branch: main
          fingerprint-db-cache-key: fingerprint-db-saving-branch-test
          fingerprint-installation-cache: "false"
      - name: Assert action ran with saving-db-branch input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CURRENT_FINGERPRINT: ${{ steps.action.outputs.current-fingerprint }}
          CURRENT_COMMIT: ${{ steps.action.outputs.current-git-commit }}
        run: |
          echo "outcome: $OUTCOME"
          echo "current-fingerprint: $CURRENT_FINGERPRINT"
          echo "current-git-commit: $CURRENT_COMMIT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CURRENT_FINGERPRINT" ]; then
              echo "FAIL: action succeeded but current-fingerprint output is empty"
              exit 1
            fi
            echo "PASS: got fingerprint '$CURRENT_FINGERPRINT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
