name: Test environment input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          profile: production
          platform: all
          environment: production
          github-token: ${{ github.token }}
      - name: Assert action ran with environment input (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ANDROID_FP: ${{ steps.action.outputs.android-fingerprint }}
          IOS_FP: ${{ steps.action.outputs.ios-fingerprint }}
        run: |
          echo "outcome: $OUTCOME"
          echo "android-fingerprint: $ANDROID_FP"
          echo "ios-fingerprint: $IOS_FP"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with environment input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo / missing EAS config)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
