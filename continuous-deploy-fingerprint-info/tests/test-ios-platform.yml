name: Test ios platform only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          profile: staging
          platform: ios
          github-token: ${{ github.token }}

      - name: Assert action ran for ios platform or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IOS_FP: ${{ steps.action.outputs.ios-fingerprint }}
          ANDROID_FP: ${{ steps.action.outputs.android-fingerprint }}
          IOS_BUILD: ${{ steps.action.outputs.ios-build-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ios-fingerprint: $IOS_FP"
          echo "android-fingerprint: $ANDROID_FP"
          echo "ios-build-id: $IOS_BUILD"

          if [ "$OUTCOME" = "success" ]; then
            # When platform=ios, ios fingerprint should be set
            if [ -z "$IOS_FP" ]; then
              echo "FAIL: action succeeded with ios platform but ios-fingerprint is empty"
              exit 1
            fi
            echo "PASS: ios fingerprint is set: $IOS_FP"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real EAS credentials/project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
