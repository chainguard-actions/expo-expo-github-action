name: Test missing working directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          profile: production
          working-directory: this-directory-does-not-exist
      - name: Assert action failed and produced no build ids
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ANDROID_BUILD: ${{ steps.action.outputs.android-build-id }}
          IOS_BUILD: ${{ steps.action.outputs.ios-build-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "android-build-id: $ANDROID_BUILD"
          echo "ios-build-id: $IOS_BUILD"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent working directory, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$ANDROID_BUILD" ] || [ -n "$IOS_BUILD" ]; then
            echo "FAIL: expected no build ids on failure"
            exit 1
          fi
          echo "PASS"
