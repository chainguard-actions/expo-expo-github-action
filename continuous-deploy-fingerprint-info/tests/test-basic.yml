name: Test basic usage - all platforms
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          profile: production
          platform: all
          github-token: ${{ github.token }}

      - name: Assert action ran and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ANDROID_FP: ${{ steps.action.outputs.android-fingerprint }}
          IOS_FP: ${{ steps.action.outputs.ios-fingerprint }}
          ANDROID_BUILD: ${{ steps.action.outputs.android-build-id }}
          IOS_BUILD: ${{ steps.action.outputs.ios-build-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "android-fingerprint: $ANDROID_FP"
          echo "ios-fingerprint: $IOS_FP"
          echo "android-build-id: $ANDROID_BUILD"
          echo "ios-build-id: $IOS_BUILD"

          if [ "$OUTCOME" = "success" ]; then
            # If it succeeded, at least one fingerprint should be set
            if [ -z "$ANDROID_FP" ] && [ -z "$IOS_FP" ]; then
              echo "FAIL: action succeeded but no fingerprint outputs were set"
              exit 1
            fi
            echo "PASS: action succeeded with fingerprint outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real EAS credentials/project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
