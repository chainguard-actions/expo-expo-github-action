name: Test basic usage with profile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          profile: production
          platform: all
      - name: Assert action ran (outputs set, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ANDROID_FINGERPRINT: ${{ steps.action.outputs.android-fingerprint }}
          IOS_FINGERPRINT: ${{ steps.action.outputs.ios-fingerprint }}
          ANDROID_BUILD_ID: ${{ steps.action.outputs.android-build-id }}
          IOS_BUILD_ID: ${{ steps.action.outputs.ios-build-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "android-fingerprint: $ANDROID_FINGERPRINT"
          echo "ios-fingerprint: $IOS_FINGERPRINT"
          echo "android-build-id: $ANDROID_BUILD_ID"
          echo "ios-build-id: $IOS_BUILD_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness without real EAS project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
