name: Test missing required command input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          comment: "false"
          fingerprint-installation-cache: "false"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT: ${{ steps.action.outputs.comment }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment: $COMMENT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when 'command' input is missing"
            exit 1
          fi
          echo "PASS"
