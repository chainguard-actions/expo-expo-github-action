name: Test fingerprint options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: eas build --platform all --non-interactive
          comment: false
          github-token: ${{ github.token }}
          fingerprint-version: latest
          fingerprint-installation-cache: false
          fingerprint-db-cache-key: test-fingerprint-db

      - name: Assert action ran with fingerprint options
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GIT_COMMIT_HASH: ${{ steps.action.outputs.gitCommitHash }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gitCommitHash: $GIT_COMMIT_HASH"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with fingerprint options"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without EAS credentials/project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
