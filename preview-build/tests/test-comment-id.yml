name: Test comment-id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: eas build --platform android --non-interactive
          comment: "true"
          comment-id: "expo-preview-{platform}"
          packager: yarn
      - name: Assert action ran with comment-id input (outputs set, or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_ID: ${{ steps.action.outputs.commentId }}
        run: |
          echo "outcome: $OUTCOME"
          echo "commentId: $COMMENT_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without EAS credentials or valid repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
