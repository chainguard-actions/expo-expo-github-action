name: Test custom inputs - working-directory and fingerprint-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a subdirectory to use as working-directory
        run: mkdir -p "$GITHUB_WORKSPACE/my-app"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: eas build --platform ios --non-interactive
          comment: "false"
          working-directory: ${{ github.workspace }}/my-app
          fingerprint-version: latest
          fingerprint-installation-cache: "false"
          github-token: ${{ github.token }}

      - name: Assert action ran with custom inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GIT_HASH: ${{ steps.action.outputs.gitCommitHash }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gitCommitHash: $GIT_HASH"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without EAS credentials/project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
