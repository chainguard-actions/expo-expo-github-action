name: Test eas-build-message and comment-id inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: eas build --platform all --non-interactive
          comment: "true"
          comment-id: "preview-build-{platform}"
          eas-build-message: "Test build from CI"
          github-token: ${{ github.token }}

      - name: Assert action ran with build message inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_ID: ${{ steps.action.outputs.commentId }}
          ANDROID_BUILD_ID: ${{ steps.action.outputs.androidBuildId }}
          IOS_BUILD_ID: ${{ steps.action.outputs.iosBuildId }}
        run: |
          echo "outcome: $OUTCOME"
          echo "commentId: $COMMENT_ID"
          echo "androidBuildId: $ANDROID_BUILD_ID"
          echo "iosBuildId: $IOS_BUILD_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with build message and comment-id"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without EAS credentials/project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
