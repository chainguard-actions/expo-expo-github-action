name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: eas build --platform all --non-interactive
          comment: "false"
          github-token: ${{ github.token }}

      - name: Assert action ran and produced expected outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROJECT_ID: ${{ steps.action.outputs.projectId }}
          COMMENT_ID: ${{ steps.action.outputs.commentId }}
        run: |
          echo "outcome: $OUTCOME"
          echo "projectId: $PROJECT_ID"
          echo "commentId: $COMMENT_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo / no EAS project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
