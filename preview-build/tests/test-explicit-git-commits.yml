name: Test explicit git commits and comment options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create minimal Expo app without EAS project id
        run: |
          mkdir -p "$RUNNER_TEMP/expo-app"
          cat > "$RUNNER_TEMP/expo-app/app.json" <<'EOF'
          { "expo": { "name": "test-app", "slug": "test-app" } }
          EOF
          cat > "$RUNNER_TEMP/expo-app/package.json" <<'EOF'
          { "name": "test-app", "version": "1.0.0", "private": true }
          EOF
      - name: Resolve current commit
        id: sha
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: eas build --profile preview --platform all --non-interactive
          comment: "false"
          comment-id: "test-preview-build-{projectId}"
          packager: npm
          fingerprint-installation-cache: "false"
          working-directory: ${{ runner.temp }}/expo-app
          eas-build-message: "Test build message"
          previous-git-commit: ${{ steps.sha.outputs.head }}
          current-git-commit: ${{ steps.sha.outputs.head }}
          saving-db-branch: main
      - name: Assert action failed without EAS credentials/project id
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ANDROID_LINK: ${{ steps.action.outputs.androidLink }}
          IOS_LINK: ${{ steps.action.outputs.iosLink }}
        run: |
          echo "outcome: $OUTCOME"
          echo "androidLink: $ANDROID_LINK"
          echo "iosLink: $IOS_LINK"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (no EAS project id / no EXPO_TOKEN)"
            exit 1
          fi
          if [ -n "$ANDROID_LINK" ] || [ -n "$IOS_LINK" ]; then
            echo "FAIL: build links should not be set"
            exit 1
          fi
          echo "PASS"
