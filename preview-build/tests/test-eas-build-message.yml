name: Test with eas-build-message input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: eas build --platform ios --non-interactive
          comment: "false"
          eas-build-message: "Preview build for PR test scenario"
          github-token: ${{ github.token }}
      - name: Assert action ran with eas-build-message (outputs set or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IOS_BUILD_ID: ${{ steps.action.outputs.iosBuildId }}
          IOS_LINK: ${{ steps.action.outputs.iosLink }}
          IOS_APP_VERSION: ${{ steps.action.outputs.iosAppVersion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "iosBuildId: $IOS_BUILD_ID"
          echo "iosLink: $IOS_LINK"
          echo "iosAppVersion: $IOS_APP_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without EAS credentials or real repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
