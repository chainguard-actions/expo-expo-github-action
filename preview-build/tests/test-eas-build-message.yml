name: Test eas-build-message input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: eas build --platform ios --non-interactive
          comment: "false"
          eas-build-message: "Preview build for testing"
          packager: yarn
      - name: Assert action ran with eas-build-message input (outputs set, or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GIT_HASH: ${{ steps.action.outputs.gitCommitHash }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gitCommitHash: $GIT_HASH"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without EAS credentials or valid repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
