name: Test missing working directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: eas build --profile preview --platform all --non-interactive
          comment: "false"
          fingerprint-installation-cache: "false"
          working-directory: ${{ github.workspace }}/does-not-exist-expo-app
      - name: Assert action failed and produced no build outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ANDROID_ID: ${{ steps.action.outputs.androidBuildId }}
          IOS_ID: ${{ steps.action.outputs.iosBuildId }}
        run: |
          echo "outcome: $OUTCOME"
          echo "androidBuildId: $ANDROID_ID"
          echo "iosBuildId: $IOS_ID"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent working directory"
            exit 1
          fi
          if [ -n "$ANDROID_ID" ] || [ -n "$IOS_ID" ]; then
            echo "FAIL: build IDs should not be set"
            exit 1
          fi
          echo "PASS"
