name: Test with custom working directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a subdirectory to simulate an Expo app directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/my-expo-app"
          echo '{"name":"my-expo-app","version":"1.0.0"}' > "$GITHUB_WORKSPACE/my-expo-app/package.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: "eas build --platform ios --non-interactive"
          comment: "false"
          working-directory: "${{ github.workspace }}/my-expo-app"
          fingerprint-version: "latest"
          fingerprint-installation-cache: "false"
          github-token: ${{ github.token }}

      - name: Assert action ran and failed gracefully (no EAS credentials / sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no EAS credentials / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
