name: Test with explicit git commit hashes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get current and previous commit hashes
        id: commits
        run: |
          CURRENT=$(git rev-parse HEAD)
          PREVIOUS=$(git rev-parse HEAD~1 2>/dev/null || echo "$CURRENT")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "current commit: $CURRENT"
          echo "previous commit: $PREVIOUS"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: "eas build --platform all --non-interactive"
          comment: "false"
          fingerprint-installation-cache: "false"
          current-git-commit: ${{ steps.commits.outputs.current }}
          previous-git-commit: ${{ steps.commits.outputs.previous }}
          github-token: ${{ github.token }}

      - name: Assert action ran and failed gracefully (no EAS credentials / sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GIT_HASH: ${{ steps.action.outputs.gitCommitHash }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gitCommitHash: $GIT_HASH"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no EAS credentials / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
