name: Test no-comment mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: eas build --platform ios --non-interactive
          comment: false
          github-token: ${{ github.token }}

      - name: Assert action ran with comment disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_ID: ${{ steps.action.outputs.commentId }}
          COMMENT_OUTPUT: ${{ steps.action.outputs.comment }}
        run: |
          echo "outcome: $OUTCOME"
          echo "commentId: $COMMENT_ID"
          echo "comment output: $COMMENT_OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with comment disabled"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without EAS credentials/project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
