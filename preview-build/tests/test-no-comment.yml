name: Test no-comment mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: eas build --platform android --non-interactive
          comment: "false"
          github-token: ${{ github.token }}

      - name: Assert action ran (no-comment mode)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_OUT: ${{ steps.action.outputs.comment }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment output: $COMMENT_OUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded without posting a comment"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo / no EAS project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
